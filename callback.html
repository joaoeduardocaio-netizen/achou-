<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACHOU! — Mercado Livre</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:Arial}main{max-width:420px;padding:32px;text-align:center;border:1px solid #333;border-radius:22px}.logo{font-size:38px;font-weight:900}.logo i{color:#FFD400;font-style:normal}.box{margin-top:20px;padding:16px;border:1px solid #444;border-radius:12px}a{display:inline-block;margin-top:20px;padding:14px 20px;background:#FFD400;color:#000;text-decoration:none;font-weight:800;border-radius:12px}</style></head>
<body><main><div class="logo">ACHOU<i>!</i></div><h2>Conectando Mercado Livre</h2><div id="s" class="box">Processando autorização...</div><a id="back" href="./ml-connect.html" hidden>Tentar novamente</a></main>
<script>
const FN="https://wulhcgkphclwgidqlvtr.supabase.co/functions/v1/mercadolivre-oauth";
function cookie(n){const m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}
function fail(m){s.textContent="❌ "+m;back.hidden=false}
(async()=>{try{const p=new URLSearchParams(location.search),code=p.get("code"),returnedState=p.get("state"),v=cookie("ml_pkce"),expectedState=cookie("ml_state");
if(p.get("error"))return fail(p.get("error_description")||"Autorização recusada.");
if(!code)return fail("O Mercado Livre não retornou o código.");
if(!v)return fail("Código PKCE não encontrado. Inicie novamente.");
if(!returnedState||!expectedState||returnedState!==expectedState)return fail("Validação de segurança da autorização falhou.");
const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,code_verifier:v})});const d=await r.json();
if(!r.ok||!d.ok){console.error(d);return fail("Não foi possível concluir a autorização.");}
document.cookie="ml_pkce=; Max-Age=0; Path=/achou-/; SameSite=Lax; Secure";document.cookie="ml_state=; Max-Age=0; Path=/achou-/; SameSite=Lax; Secure";
history.replaceState({},document.title,location.pathname);s.textContent="✅ Mercado Livre conectado com sucesso!";back.hidden=true;
}catch(e){console.error(e);fail("Erro inesperado ao concluir a conexão.");}})();
</script></body></html>
