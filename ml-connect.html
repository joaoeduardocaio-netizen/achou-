<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACHOU! — Conectar Mercado Livre</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:Arial}main{max-width:420px;padding:32px;text-align:center;border:1px solid #333;border-radius:22px}b{font-size:38px}b i{color:#FFD400;font-style:normal}button{margin-top:20px;padding:15px 22px;border:0;border-radius:12px;background:#FFD400;font-weight:800;font-size:16px}</style></head>
<body><main><b>ACHOU<i>!</i></b><h2>Conectar Mercado Livre</h2><p>Autorize novamente o ACHOU! para aplicar as permissões atualizadas.</p><button id="go">Autorizar Mercado Livre</button></main>
<script>
const CLIENT_ID="4433631292282705", REDIRECT_URI="https://joaoeduardocaio-netizen.github.io/achou-/callback.html";
function b64u(a){let s="";a.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
go.onclick=async()=>{const a=new Uint8Array(64);crypto.getRandomValues(a);const v=b64u(a);const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));const c=b64u(new Uint8Array(d));
const state=b64u(crypto.getRandomValues(new Uint8Array(18)));
document.cookie="ml_pkce="+encodeURIComponent(v)+"; Max-Age=600; Path=/achou-/; SameSite=Lax; Secure";
document.cookie="ml_state="+encodeURIComponent(state)+"; Max-Age=600; Path=/achou-/; SameSite=Lax; Secure";
const u=new URL("https://auth.mercadolivre.com.br/authorization");u.searchParams.set("response_type","code");u.searchParams.set("client_id",CLIENT_ID);u.searchParams.set("redirect_uri",REDIRECT_URI);u.searchParams.set("code_challenge",c);u.searchParams.set("code_challenge_method","S256");u.searchParams.set("state",state);location.assign(u)};
</script></body></html>
